apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: local-retail
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_DB
              value: "retail_db"
            - name: POSTGRES_USER
              value: "retail_user"
            - name: POSTGRES_PASSWORD
              value: "retail_pass"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: local-retail
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: auth-service
  type: ClusterIP
---
