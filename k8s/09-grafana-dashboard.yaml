apiVersion: v1
kind: ConfigMap
metadata:
  name: aurastore-grafana-dashboard
  namespace: cattle-monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  aurastore-overview.json: |
    {
      "uid": "aurastore-prod",
      "title": "AuraStore - Production Observability",
      "tags": [
        "production",
        "e-commerce",
        "kubernetes"
      ],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "query": "label_values(http_server_requests_seconds_count{namespace=\"production-retail\"}, application)",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(up, namespace)",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "includeAll": false,
            "multi": false,
            "current": {
              "selected": false,
              "text": "production-retail",
              "value": "production-retail"
            },
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Application Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "id": 100,
          "panels": []
        },
        {
          "id": 1,
          "title": "Services Online",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(up{namespace=\"production-retail\"} == 1)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "Services Offline",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(up{namespace=\"production-retail\"} == 0) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "NONE",
                            "color": "green",
                            "index": 0
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "value": 0,
                          "color": "green"
                        },
                        {
                          "value": 1,
                          "color": "red"
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Total Request Rate",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "blue"
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Avg Response Time",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "yellow"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "yellow"
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Error Rate",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\",status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "yellow"
                  },
                  {
                    "value": 5,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 6,
          "title": "Active Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"production-retail\",phase=\"Running\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "purple"
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "type": "row",
          "title": "Service Health",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "collapsed": false,
          "id": 101,
          "panels": []
        },
        {
          "id": 7,
          "title": "Service Uptime",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "up{namespace=\"production-retail\"}",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "type": "row",
          "title": "HTTP Traffic",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "collapsed": false,
          "id": 102,
          "panels": []
        },
        {
          "id": 8,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (application)",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "scheme",
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "pointSize": 5,
                "showPoints": "never",
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "Requests/sec",
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 9,
          "title": "Request Distribution by Status",
          "type": "piechart",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "pieType": "donut",
            "tooltip": {
              "mode": "single"
            },
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 10,
          "title": "Response Latency (p50/p95/p99)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(rate(http_server_requests_seconds_bucket{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "scheme",
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "pointSize": 5,
                "showPoints": "never",
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "Latency (seconds)",
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "p50"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p95"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "yellow",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p99"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "row",
          "title": "HTTP Errors",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "collapsed": false,
          "id": 103,
          "panels": []
        },
        {
          "id": 11,
          "title": "Error Rate by Service (%)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\",status=~\"5..\"}[5m])) by (application) / sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (application)",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "scheme",
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "pointSize": 5,
                "showPoints": "never",
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "Error Rate %",
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "unit": "percent"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": ".+"
                },
                "properties": [
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "line+dashed"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "value": 0,
                          "color": "green"
                        },
                        {
                          "value": 1,
                          "color": "yellow"
                        },
                        {
                          "value": 5,
                          "color": "red"
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 12,
          "title": "Error Breakdown by Status",
          "type": "barchart",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 17
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"production-retail\",application=~\"$service\",status=~\"[45]..\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0,
                "gradientMode": "scheme",
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "Requests/sec",
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^4\\d{2}$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "yellow",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^5\\d{2}$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "orientation": "horizontal",
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "xTickLabelRotation": 0,
            "showValue": "auto",
            "groupWidth": 0.7,
            "barWidth": 0.9,
            "stacking": {
              "mode": "none",
              "group": "A"
            }
          }
        },
        {
          "id": 13,
          "title": "Slowest Endpoints (p99)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 17
          },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"production-retail\",application=~\"$service\"}[5m])) by (application, uri, method)))",
              "legendFormat": "{{application}} {{method}} {{uri}}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 0.5,
                    "color": "yellow"
                  },
                  {
                    "value": 2,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": [
              {
