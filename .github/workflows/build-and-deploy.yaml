name: Build and Push Images

permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: write
  checks: write
  security-events: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build (leave empty for all changed)'
        required: false
        default: ''
      environment:
        description: 'Target environment (staging/production)'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      catalog-service: ${{ steps.changes.outputs.catalog-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      history-service: ${{ steps.changes.outputs.history-service }}
      storefront: ${{ steps.changes.outputs.storefront }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          if [ -n "${{ github.event.inputs.services }}" ]; then
            IFS=',' read -ra SVCS <<< "${{ github.event.inputs.services }}"
            for svc in "${SVCS[@]}"; do
              echo "${svc}=true" >> $GITHUB_OUTPUT
            done
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              CHANGED=$(git diff --name-only "$BASE".."$HEAD" 2>/dev/null || echo "")
            elif [ "${{ github.event_name }}" = "push" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
              else
                CHANGED=$(git diff --name-only "$(git rev-list --max-parents=0 HEAD)" HEAD 2>/dev/null || echo "")
              fi
            else
              CHANGED=""
            fi

            echo "api-gateway=$(echo "$CHANGED" | grep -q '^microservices/api-gateway/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "auth-service=$(echo "$CHANGED" | grep -q '^microservices/auth-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "catalog-service=$(echo "$CHANGED" | grep -q '^microservices/catalog-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "order-service=$(echo "$CHANGED" | grep -q '^microservices/order-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "history-service=$(echo "$CHANGED" | grep -q '^microservices/history-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "storefront=$(echo "$CHANGED" | grep -qE '^(src|package\.json|vitest|tsconfig|vite)' && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Extract PR number
        id: pr
        if: github.event_name == 'pull_request'
        run: |
          echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

  build-java-services:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: microservices/api-gateway
            java: true
            port: "8080"
          - service: auth-service
            context: microservices/auth-service
            java: true
            port: "8081"
          - service: catalog-service
            context: microservices/catalog-service
            java: true
            port: "8082"
          - service: order-service
            context: microservices/order-service
            java: true
            port: "8083"
          - service: history-service
            context: microservices/history-service
            java: true
            port: "8084"
    steps:
      - name: Check if service changed
        id: check
        run: echo "changed=${{ needs.detect-changes.outputs[format('{0}', matrix.service)] }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.check.outputs.changed == 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        if: steps.check.outputs.changed == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        if: steps.check.outputs.changed == 'true'
        working-directory: ${{ matrix.context }}
        run: mvn test -B

      - name: Build with Maven
        if: steps.check.outputs.changed == 'true'
        working-directory: ${{ matrix.context }}
        run: mvn clean package -DskipTests -B

      - name: Log in to ghcr.io
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          TAG="${{ github.sha }}"
          SVC="${{ matrix.service }}"
          OWNER="${{ github.repository_owner }}"
          docker build -t "ghcr.io/ayushquasar/${SVC}:${TAG}" \
                       -t "ghcr.io/ayushquasar/${SVC}:latest" \
                       "${{ matrix.context }}"
          docker push "ghcr.io/ayushquasar/${SVC}:${TAG}"
          docker push "ghcr.io/ayushquasar/${SVC}:latest"

  build-storefront:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Check if storefront changed
        id: check
        run: echo "changed=${{ needs.detect-changes.outputs.storefront }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.check.outputs.changed == 'true'

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm install

      - name: Run unit tests
        if: steps.check.outputs.changed == 'true'
        run: npm test

      - name: Lint
        if: steps.check.outputs.changed == 'true'
        run: npm run lint

      - name: Log in to ghcr.io
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          TAG="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"
          docker build -t "ghcr.io/ayushquasar/storefront:${TAG}" \
                       -t "ghcr.io/ayushquasar/storefront:latest" \
                       .
          docker push "ghcr.io/ayushquasar/storefront:${TAG}"
          docker push "ghcr.io/ayushquasar/storefront:latest"

  qodana:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2024.3
        with:
          args: --baseline,qodana.sarif.json
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  trivy-scan:
    needs: [build-java-services, build-storefront]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'ghcr.io/ayushquasar/*:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container-scan

  notify-failure:
    needs: [build-java-services, build-storefront, qodana, trivy-scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *AuraStore Build Failed*",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*AuraStore Build/Test Failed*\\nRepository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha.substr(0,7) }}`>\\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Teams notification
        if: env.TEAMS_WEBHOOK_URL != ''
        uses: skation/github-action-teams@v2
        with:
          webhook: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "AuraStore Build Failed"
          text: "Repository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nCommit: ${{ github.sha }}\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
          color: "FF0000"

  notify-deploy-failure:
    needs: [smoke-tests, rollback]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send deploy failure alert
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔥 *AuraStore Deploy Failed*",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*AuraStore Deployment Failed*\\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha.substr(0,7) }}`>\\nPipeline passed build stage but failed during deployment or smoke tests\\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\\nArgoCD: <https://argocd.cris-atoms.local|Check ArgoCD>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-approval:
    needs: [build-java-services, build-storefront, qodana, trivy-scan]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for manual approval
        run: echo "Deployment approved - proceeding to update deploy repo"

      - name: Notify approval pending
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "⏳ *AuraStore Deploy Pending Approval*",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*AuraStore Deployment Awaiting Approval*\\nCommit: ${{ github.sha }}\\nBy: ${{ github.actor }}\\nApprove at: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Pipeline>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  update-deploy-repo:
    needs: [deploy-approval]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ayushQuasar/aura-store-deployments
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          TAG="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"

          declare -A SVC_MAP
          SVC_MAP[api-gateway]="${{ needs.detect-changes.outputs.api-gateway }}"
          SVC_MAP[auth-service]="${{ needs.detect-changes.outputs.auth-service }}"
          SVC_MAP[catalog-service]="${{ needs.detect-changes.outputs.catalog-service }}"
          SVC_MAP[order-service]="${{ needs.detect-changes.outputs.order-service }}"
          SVC_MAP[history-service]="${{ needs.detect-changes.outputs.history-service }}"
          SVC_MAP[storefront]="${{ needs.detect-changes.outputs.storefront }}"

          for svc in "${!SVC_MAP[@]}"; do
            if [ "${SVC_MAP[$svc]}" = "true" ]; then
              echo "Updating ${svc} -> ${TAG}"
              cd "base/${svc}"
              kustomize edit set image "ghcr.io/ayushquasar/${svc}=ghcr.io/ayushquasar/${svc}:${TAG}"
              cd "${GITHUB_WORKSPACE}"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update image tags to ${{ github.sha }}"
          git push

  argocd-sync:
    needs: update-deploy-repo
    runs-on: ubuntu-latest
    steps:
      - name: Install argocd CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: Sync ArgoCD applications
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --insecure
          for app in aurastore-apps aurastore-infrastructure aurastore-istio aurastore-monitoring; do
            echo "Syncing $app..."
            argocd app sync "$app" --auto-prune --self-heal --timeout 300 || true
          done

  smoke-tests:
    needs: argocd-sync
    runs-on: ubuntu-latest
    steps:
      - name: Wait for rollout
        run: sleep 60

      - name: Health check endpoints
        run: |
          for svc in auth catalog order history api-gateway storefront; do
            url="https://ecommerce.cris-atoms.local/api/${svc}/actuator/health"
            if [ "$svc" = "storefront" ]; then
              url="https://ecommerce.cris-atoms.local"
            fi
            echo "Checking $url..."
            for i in {1..10}; do
              if curl -sf "$url" > /dev/null; then
                echo "✓ $svc healthy"
                break
              fi
              sleep 5
            done
          done

  rollback:
    needs: [argocd-sync, smoke-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArgoCD rollback to previous version
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --insecure
          for app in aurastore-apps aurastore-infrastructure aurastore-istio aurastore-monitoring; do
            echo "Rolling back $app..."
            argocd app rollback "$app" --to-revision $(argocd app history "$app" -o json | jq -r '.[1].revision') || true
          done

      - name: Notify rollback
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔙 *AuraStore Rollback Triggered*",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*AuraStore Rollback Initiated*\\nCommit: ${{ github.sha }}\\nSmoke tests failed - rolling back all ArgoCD apps to previous revision\\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-success:
    needs: [notify-deploy-failure]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *AuraStore Deployment Successful*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*AuraStore Deployed Successfully*\\nRepository: ${{ github.repository }}\\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`{{ github.sha.substr(0,7) }}`>\\nEnvironment: Production\\nArgoCD: <https://argocd.cris-atoms.local|Open ArgoCD>\\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  qodana-report:
    needs: qodana
    if: success() && env.QODANA_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify Qodana results
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔍 *AuraStore Static Analysis Complete*",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Qodana Analysis Complete*\\nCommit: ${{ github.sha }}\\nCheck the SARIF report in the GitHub Security tab"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
